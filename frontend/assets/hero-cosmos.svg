<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Deep space horizon">
  <defs>
    <radialGradient id="nebulaA" cx="22%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#3d7ab0" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#1a3a5c" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#03050a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="78%" cy="18%" r="40%">
      <stop offset="0%" stop-color="#6a8fd0" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#03050a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="60%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#245070" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#03050a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d8e8f5"/>
      <stop offset="28%" stop-color="#6aa0c8"/>
      <stop offset="62%" stop-color="#234868"/>
      <stop offset="100%" stop-color="#0a1624"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8f2" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#5ec8f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c47c" stop-opacity=".15"/>
      <stop offset="40%" stop-color="#eef3f8" stop-opacity=".85"/>
      <stop offset="70%" stop-color="#5ec8f2" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#e8c47c" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#03050a"/>
  <rect width="1600" height="900" fill="url(#nebulaA)"/>
  <rect width="1600" height="900" fill="url(#nebulaB)"/>
  <rect width="1600" height="900" fill="url(#nebulaC)"/>
  <!-- stars -->
  <g fill="#eef3f8">
    <circle cx="120" cy="90" r="1.4" opacity=".9"/>
    <circle cx="260" cy="160" r="1" opacity=".7"/>
    <circle cx="410" cy="70" r="1.2" opacity=".85"/>
    <circle cx="540" cy="210" r=".8" opacity=".6"/>
    <circle cx="700" cy="40" r="1.1" opacity=".8"/>
    <circle cx="880" cy="130" r="1.5" opacity=".95"/>
    <circle cx="1020" cy="60" r=".9" opacity=".65"/>
    <circle cx="1180" cy="180" r="1.2" opacity=".8"/>
    <circle cx="1320" cy="90" r="1" opacity=".7"/>
    <circle cx="1480" cy="150" r="1.3" opacity=".85"/>
    <circle cx="180" cy="320" r=".9" opacity=".55"/>
    <circle cx="360" cy="400" r="1.1" opacity=".7"/>
    <circle cx="520" cy="280" r=".7" opacity=".5"/>
    <circle cx="760" cy="340" r="1" opacity=".65"/>
    <circle cx="980" cy="260" r="1.2" opacity=".75"/>
    <circle cx="1210" cy="310" r=".8" opacity=".55"/>
    <circle cx="1400" cy="270" r="1.1" opacity=".7"/>
    <circle cx="90" cy="520" r="1" opacity=".6"/>
    <circle cx="250" cy="610" r="1.3" opacity=".8"/>
    <circle cx="470" cy="560" r=".8" opacity=".5"/>
    <circle cx="650" cy="680" r="1" opacity=".65"/>
    <circle cx="860" cy="600" r="1.4" opacity=".85"/>
    <circle cx="1100" cy="720" r=".9" opacity=".55"/>
    <circle cx="1290" cy="580" r="1.1" opacity=".7"/>
    <circle cx="1510" cy="640" r="1" opacity=".6"/>
    <circle cx="1450" cy="430" r=".7" opacity=".45"/>
    <circle cx="80" cy="780" r="1.2" opacity=".7"/>
    <circle cx="330" cy="820" r=".9" opacity=".55"/>
    <circle cx="990" cy="820" r="1.1" opacity=".65"/>
    <circle cx="1550" cy="800" r="1.3" opacity=".75"/>
  </g>
  <!-- distant galaxy smear -->
  <ellipse cx="1280" cy="220" rx="160" ry="18" fill="#7aa2ff" opacity=".18" transform="rotate(-28 1280 220)"/>
  <ellipse cx="1280" cy="220" rx="90" ry="8" fill="#eef3f8" opacity=".12" transform="rotate(-28 1280 220)"/>
  <!-- planet -->
  <circle cx="1180" cy="520" r="210" fill="url(#glow)"/>
  <circle cx="1180" cy="520" r="150" fill="url(#planet)"/>
  <ellipse cx="1180" cy="520" rx="230" ry="42" fill="none" stroke="url(#ring)" stroke-width="10" transform="rotate(-18 1180 520)"/>
  <ellipse cx="1180" cy="520" rx="210" ry="28" fill="none" stroke="#eef3f8" stroke-opacity=".25" stroke-width="3" transform="rotate(-18 1180 520)"/>
  <!-- planet terminator sheen -->
  <ellipse cx="1135" cy="480" rx="70" ry="95" fill="#eef3f8" opacity=".12"/>
  <!-- small moon -->
  <circle cx="980" cy="390" r="18" fill="#9eb4c8"/>
  <circle cx="974" cy="386" r="18" fill="#03050a" opacity=".35"/>
</svg>
