<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PULSE — The cosmos. In motion. Galaxy exploration: NASA APOD, planets in orbit, ISS, launches." />
    <title>PULSE — The Cosmos. In Motion.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <script src="/config.js"></script>
    <script src="https://unpkg.com/lucide@0.460.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="/" data-nav="/">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-text">
            <span class="brand-name">PULSE</span>
            <span class="brand-live"><span class="live-dot"></span> DEEP SPACE</span>
          </div>
        </a>
        <nav class="nav-links" id="nav" aria-label="Primary"></nav>
        <div class="top-actions">
          <div class="clock" id="clock">
            <div class="mono" id="clock-utc">UTC --:--:--</div>
            <div id="clock-local">Local --:--:--</div>
          </div>
          <button class="btn icon" id="btn-search" title="Search (Ctrl/Cmd+K)" aria-label="Search">
            <i data-lucide="search" width="16" height="16"></i>
          </button>
        </div>
      </header>

      <main class="main">
        <section class="view view-overview" id="view-overview" data-view="overview"></section>
        <section class="view view-space" id="view-space" data-view="space"></section>
      </main>
    </div>

    <div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Search">
      <div class="search-modal">
        <div class="field">
          <i data-lucide="search" width="16" height="16"></i>
          <input id="search-input" type="search" placeholder="Search APOD, planets, launches, ISS…" autocomplete="off" />
          <kbd class="mono muted">ESC</kbd>
        </div>
        <div class="search-results" id="search-results"></div>
        <div class="search-hints">
          <span>↑↓ navigate · Enter open</span>
          <span>Ctrl/Cmd + K</span>
        </div>
      </div>
    </div>

    <div class="drawer panel" id="detail-drawer">
      <div class="panel-header">
        <div class="panel-title" id="drawer-title">Details</div>
        <button class="btn icon ghost" id="drawer-close" aria-label="Close">
          <i data-lucide="x" width="16" height="16"></i>
        </button>
      </div>
      <div class="panel-body" id="drawer-body"></div>
      <div class="source-line" id="drawer-source"></div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
